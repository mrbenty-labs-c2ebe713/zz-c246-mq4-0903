name: vfy-mq-ceiling
on:
  merge_group:
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ceiling probe
        run: |
          echo "VFY2 event=$GITHUB_EVENT_NAME repository=$GITHUB_REPOSITORY ref=$GITHUB_REF"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "VFY2 OIDC: request URL PRESENT -> id-token write is granted"
            curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vfy-internal" -o /tmp/o.json
            python3 - <<'EOF'
import json,base64
t=json.load(open('/tmp/o.json'))['value']
p=t.split('.')[1]; p+='='*(-len(p)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print("VFY2 OIDC CLAIMS:", json.dumps({k:c.get(k) for k in ["iss","aud","sub","repository","repository_owner","actor","workflow_ref","job_workflow_ref","event_name"]}))
EOF
          else
            echo "VFY2 OIDC: request URL ABSENT -> id-token NOT granted"
          fi
