name: slowgate
on:
  pull_request:
  merge_group:
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CPX gate ok event=${{ github.event_name }}"
  envprobe:
    runs-on: ubuntu-latest
    environment: cpx-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: mint OIDC and print CLAIMS ONLY
        run: |
          echo "CPX2 event=${{ github.event_name }} ref=$GITHUB_REF"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "CPX2 OIDC: NO REQUEST URL - id-token NOT granted"; exit 0; fi
          echo "CPX2 OIDC: request url PRESENT"
          R=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cpx-probe")
          python3 -c '
import sys,json,base64
r=json.loads(sys.stdin.read()); t=r.get("value","")
if not t: print("CPX2 OIDC: no value"); raise SystemExit
p=t.split(".")[1]; p+="="*(-len(p)%4)
c=json.loads(base64.urlsafe_b64decode(p))
for k in ("sub","aud","repository","repository_owner","ref","environment","workflow_ref","job_workflow_ref","actor","event_name"):
    if k in c: print("CPX2 CLAIM",k,"=",c[k])
' <<< "$R"
