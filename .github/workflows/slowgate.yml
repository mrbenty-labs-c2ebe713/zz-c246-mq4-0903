name: slowgate
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "CPX event=${{ github.event_name }}"
          echo "CPX GITHUB_REF=$GITHUB_REF"
      - name: runtime token SCOPE claims only
        run: |
          python3 - <<'PY'
          import os,base64,json
          t=os.environ.get("ACTIONS_RUNTIME_TOKEN","")
          if not t:
              print("CPX RT: absent"); raise SystemExit
          p=t.split(".")[1]; p+="="*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("CPX RT scp =", c.get("scp"))
          for k in ("ac","github_ref","ref","Scope"):
              if k in c: print("CPX RT",k,"=",str(c[k])[:300])
          PY
      - name: write a cache ONLY from merge_group
        if: github.event_name == 'merge_group'
        run: |
          mkdir -p cpxdir && echo "CPX-CACHE-PAYLOAD-1027" > cpxdir/marker.txt
      - uses: actions/cache@v4
        if: github.event_name == 'merge_group'
        with:
          path: cpxdir
          key: cpx-scope-probe-1027
